<!DOCTYPE html>
<html>
<head>
    <title>Stationery Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            font-size: 22px;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>STATIONERY SHOP</h1>

        <h2>Login</h2>

        <form>
            <label>Username</label>
            <input type="text" placeholder="Andika username">

            <label>Password</label>
            <input type="password" placeholder="Andika password">

            <button type="submit">LOGIN</button>
        </form><form onsubmit="login(); return false;">

    </div>

<script>
function login() {
    window.location.href = "dashboard.html";
}
</script></body>
</html>
